[package]
name = "serde-yaml-rust2"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "YAML serialization/deserialization built on yaml-rust2 — a safe, pure-Rust, YAML 1.2 serde integration"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/NITI-Lab/serde-yaml-rust2"
readme = "README.md"
keywords = ["yaml", "serde", "serialization", "yaml-rust2"]
categories = ["encoding", "parser-implementations"]

[dependencies]
indexmap = { version = "2", features = ["serde"] }
itoa = "1"
ryu = "1"
serde = "1"
yaml-rust2 = "0.13"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
